# Acknowledged breaking changes to the public API contract.
#
# `make contract-diff` compares contracts/api/v1/openapi-baseline.yaml against
# the working tree's openapi.yaml and fails when it finds a breaking change that
# is not listed here. An entry is the written record that a break was made on
# purpose: it is reviewable in the pull request, unlike a command-line flag.
#
# Every entry has three required fields:
#
#   signature  the exact change signature the tool prints for the break, e.g.
#              "removed-path GET /v1/shows" or
#              "removed-response-field GET /v1/shows 200 application/json items.title"
#   date       the day the break landed, as YYYY-MM-DD
#   reason     one line saying why the break is acceptable and what clients
#              (the Jellyfin plugin among them) must do about it
#
# See docs/architecture/api-versioning.md for when a break is allowed at all
# (a breaking change is supposed to mean a new URL prefix, /v2) and when this
# baseline is expected to be refreshed.

version: 1
acknowledged:
  - signature: "removed-status-code GET /v1/movies/{id}/stats 501"
    date: 2026-11-09
    reason: "The 501 stub is replaced by real aggregates; clients that treated 501 as unavailable now receive Trakt's stats body with 200 and need no change."
  - signature: "removed-status-code GET /v1/shows/{id}/stats 501"
    date: 2026-11-09
    reason: "Same as the movie stats row: the 501 placeholder became a working 200 response, so nothing clients call or parse was removed."
  - signature: "removed-status-code GET /v1/movies/{id}/lists 501"
    date: 2026-11-09
    reason: "The 501 stub is replaced by real public-list data; clients that treated 501 as unavailable now receive Trakt's list array with 200 and need no change."
  - signature: "removed-status-code GET /v1/shows/{id}/lists 501"
    date: 2026-11-09
    reason: "Same as the movie lists row: the 501 placeholder became a working 200 response, so nothing clients call or parse was removed."
  - signature: "removed-status-code GET /v1/movies/{id}/watching 501"
    date: 2026-11-09
    reason: "The 501 placeholder is now a real live-session read with 200; clients that treated 501 as unavailable now get the contract profile array."
  - signature: "removed-status-code GET /v1/shows/{id}/watching 501"
    date: 2026-11-09
    reason: "Same as the movie watching row: the 501 placeholder became a working 200, so no callable or parseable surface was removed."
  - signature: "removed-status-code POST /v1/shows/{id}/progress/watched/reset 200"
    date: 2026-11-09
    reason: "The route now answers Trakt's documented 201 instead of 200; the body is unchanged ({reset_at}), so clients only need to treat 201 as success."
