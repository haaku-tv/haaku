# Local infrastructure for running the API and the Vite dev server on the host
# (`make dev-backend` / `make dev-frontend`). Not a deployment: for that, use
# the root docker-compose.yml (one container) or docker-compose.advanced.yml.
#
#   docker compose -f dev/compose.yml up -d
#   make pg-up          # alternative: a throwaway cluster, no Docker needed
#
# Host ports are offset (+50000) so native macOS/brew services (5432, 6379)
# don't shadow these containers; keep deploy/.env.example in sync.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trakt
      POSTGRES_PASSWORD: trakt
      POSTGRES_DB: trakt
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trakt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trakt
      MINIO_ROOT_PASSWORD: trakt-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Clerk emulator (github.com/pjsny/clerk-emulator, Apache-2.0) — real JWTs,
  # no network. Used for local + self-hosted dev until Phase 2 (hosted Clerk).
  # Secret: *** · API: http://localhost:4000
  clerk-emulator:
    image: node:22-alpine
    command: ["npx", "--yes", "clerk-emulator", "--persist", "/data"]
    environment:
      PORT: "4000"
      CLERK_PERSIST: /data
    ports:
      - "4000:4000"
    volumes:
      - clerkdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025" # web UI
      - "1025:1025" # SMTP

volumes:
  pgdata:
  miniodata:
  clerkdata:
