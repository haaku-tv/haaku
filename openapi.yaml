components:
    schemas:
        ErrorEnvelope:
            properties:
                error:
                    properties:
                        code:
                            type: string
                        message:
                            type: string
                    required:
                        - code
                        - message
                    type: object
            required:
                - error
            type: object
    securitySchemes:
        apiKey:
            in: header
            name: X-API-Key
            type: apiKey
        oauth:
            bearerFormat: JWT
            scheme: bearer
            type: http
