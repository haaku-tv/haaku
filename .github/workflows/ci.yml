name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Go binary embeds web/dist (web/embed.go), so every Go step needs the
      # directory to exist. Tests never serve it, so the placeholder is enough;
      # the frontend job below builds the real bundle.
      - name: Stub frontend
        run: make embed-stub

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test-go

      # TODO(T0.3): govulncheck, gitleaks secret scan, golangci-lint.

  # Independent of the Go job: the frontend is built and tested on its own, and
  # must not gate (or be gated by) the backend. `pnpm test` also fails if the
  # committed typed client has drifted from openapi.yaml.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # Reads the pinned version from web/package.json (`packageManager`).
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
