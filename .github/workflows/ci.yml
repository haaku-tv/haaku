name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Go binary embeds web/dist (web/embed.go), so every Go step needs the
      # directory to exist. Tests never serve it, so the placeholder is enough;
      # the frontend job below builds the real bundle.
      - name: Stub frontend
        run: make embed-stub

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test-go

      # TODO(T0.3): govulncheck, gitleaks secret scan, OpenAPI freshness check
      # (generated openapi.yaml diff), golangci-lint.
      # TODO: a frontend job (`make lint-web`, `make test-web`, `make frontend`)
      # once the web project builds in CI.
