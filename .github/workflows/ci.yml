name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # The Go binary embeds web/dist (web/embed.go), so every Go step needs the
      # directory to exist. Tests never serve it, so the placeholder is enough;
      # the frontend job below builds the real bundle.
      - name: Stub frontend
        run: make embed-stub

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test
        run: make test-go

      # TODO(T0.3): govulncheck, gitleaks secret scan, golangci-lint.
      # TODO: a frontend job (`make lint-web`, `make test-web`, `make frontend`)
      # once the web project builds in CI.

  # openapi.yaml is a generated artifact (see docs/architecture/api-versioning.md).
  # This job regenerates it and fails if the committed copy differs, then runs
  # the two-way route inventory check. Kept separate from the Go job so a spec
  # drift produces an obvious, isolated failure. NOTE: the held frontend PR and
  # upcoming CI-gate work also touch this file; a trivial conflict on this
  # appended block is expected.
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Stub frontend
        run: make embed-stub

      - name: Regenerate the OpenAPI spec
        run: make api-spec

      - name: Fail if the committed spec is stale
        run: git diff --exit-code -- openapi.yaml

      - name: Check the route inventory (registry <-> spec)
        run: make api-check
