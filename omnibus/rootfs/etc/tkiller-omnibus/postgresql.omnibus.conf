# Written by the tkiller omnibus image on every start. Do not edit this file;
# put overrides in another file in this directory (for example 10-local.conf),
# which loads after this one.

# Local connections only. The app connects over the socket as the tkiller role
# and authenticates by peer, so there is no database password anywhere.
listen_addresses = ''
unix_socket_directories = '/run/postgresql'

# System V shared memory is not capped by the container's /dev/shm size (64 MB
# by default under Docker), which POSIX shared memory would be.
dynamic_shared_memory_type = sysv

log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] postgres: '
