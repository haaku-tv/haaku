# Trakt parity manifest - the machine-checkable answer to "how much of Trakt do we serve?".
#
# Source of truth for the Trakt side: haaku-tv/haaku issue #4, sections A and B
# (the inventory the issue produced by diffing our spec against
# trakt/trakt-api contracts). The "ours" side is checked against the live
# code-first route registry - never against a hand-kept list.
#
# Graded by ./cmd/parity (make parity-check), which fails when:
#   * a row marked implemented/divergent names a route that is not registered,
#   * a row names a registered route but a status that contradicts it (a serving
#     route must be implemented/divergent; a 501 route must be blocked-engine),
#   * a registered route that answers 501 is not recorded here as blocked-engine,
#   * a route we serve has an inventory row here graded blocked/out-of-scope/
#     blocked-data - the manifest may not under-report what we ship (matched by
#     Trakt-shaped path, so our {media_type} and Trakt's {type} are the same
#     segment),
#   * a blocked-engine row does not name its engine, or a divergent row has no
#     compat note.
#
# Statuses:
#   implemented     a registered route serves this data at the Trakt path
#   divergent       a registered route serves this data, different path/params
#                   (the compat listener in issue #7 is the bridge)
#   blocked-engine  no route serves it; a named engine must land first
#   blocked-data    no route serves it; the data is not in our store/schema
#   out-of-scope    deliberately not served; the rationale starts with
#                   "decision:" (declined) or "deferred:" (buildable, not built).
#                   Rows for our own surface also accept "custom:".
#
# Rows whose Trakt path is empty describe our own non-Trakt surface (issue #4
# section C) so the map is complete; they are excluded from Trakt coverage.
#
# Hand-maintained, not generated: one row per Trakt endpoint, kept in the order
# issue #4 lists them so a diff against the issue reads. The "ours" value must be
# copied verbatim from the registry (internal/httpapi/routes.go or openapi.yaml);
# the gate fails if it does not match.

manifest: 1
upstream: 'trakt/trakt-api contracts (projects/api/src/contracts), as inventoried in issue #4 on 2026-11-05'
notes:
- GET /v1/movies/recommendations/{id} and GET /v1/shows/recommendations/{id} were registered as handlers returning a hard-coded empty array with 200 - a fabricated 200, which this repo forbids (a made-up payload is worse than an honest 501). They now answer 501 not_implemented and are recorded as custom blocked-engine rows in the last section, so make parity-check measures them rather than trusting prose.
sections:
- name: Calendars
  rows:
  - trakt: GET /calendars/{target}/movies/{start_date}/{days}
    ours: GET /v1/calendars/all/movies/{start_date}/{days}
    status: implemented
    rationale: Serves real rows from movies.released inside the window (calendar.handleCalendarMovies), paginated; the Trakt-shaped path and params are identical.
  - trakt: GET /calendars/{target}/dvd/{start_date}/{days}
    ours: GET /v1/calendars/all/dvd/{start_date}/{days}
    status: implemented
    rationale: Served from movie_releases.physical rows (written by ingest and hydration in the same transaction as the movie metadata); one row per movie using its earliest physical release in the window, honouring ?countries=, with /all and authenticated /my mounts.
  - trakt: GET /calendars/{target}/streaming/{start_date}/{days}
    ours: GET /v1/calendars/all/streaming/{start_date}/{days}
    status: implemented
    rationale: Same release-table query on movie_releases.digital; a movie's earliest digital date in the window (or in ?countries=), one row per movie.
  - trakt: GET /calendars/releases/hot/{start_date}/{days}
    ours: GET /v1/calendars/releases/hot/{start_date}/{days}
    status: implemented
    rationale: Merges movies.released and episodes.aired_at in the window and orders by distinct users with the title on watchlist/collection/history inside that window (shows include users with any episode history); titles with no signal are excluded.
  - trakt: GET /calendars/releases/hot/new/{start_date}/{days}
    ours: GET /v1/calendars/releases/hot/new/{start_date}/{days}
    status: implemented
    rationale: Served at Trakt's path from the episode calendar pinned to ?type=new; date-ordered, not hot-ranked.
  - trakt: GET /calendars/releases/hot/premieres/{start_date}/{days}
    ours: GET /v1/calendars/releases/hot/premieres/{start_date}/{days}
    status: implemented
    rationale: Served at Trakt's path from the episode calendar pinned to ?type=premieres (season_number > 1, episode 1).
  - trakt: GET /calendars/releases/hot/finales/{start_date}/{days}
    ours: GET /v1/calendars/releases/hot/finales/{start_date}/{days}
    status: implemented
    rationale: Served at Trakt's path from the episode calendar pinned to ?type=finale (last episode of each season).
- name: Media
  rows:
  - trakt: GET /media/trending
    ours: GET /v1/media/trending
    status: implemented
    rationale: Merged movies+shows feed ordered by the same popularity signal as /v1/movies/trending; watchers is distinct users with history in the last 24 hours.
  - trakt: GET /media/popular
    ours: GET /v1/media/popular
    status: implemented
    rationale: Merged movies+shows feed in the contract's bare movie/show union, ordered by movies/shows.popularity.
- name: Movies
  rows:
  - trakt: GET /movies/watched/{period}
    ours: GET /v1/movies/watched/{period}
    status: implemented
    rationale: Distinct user_history watchers in the period window, with play and collection counts computed for every row.
  - trakt: GET /movies/played/{period}
    ours: GET /v1/movies/played/{period}
    status: implemented
    rationale: History rows in the period window, with watcher and collection counts computed for the same row.
  - trakt: GET /movies/collected/{period}
    ours: GET /v1/movies/collected/{period}
    status: implemented
    rationale: Distinct collectors with collected_at in the period window, with watcher and play counts computed too.
  - trakt: GET /movies/anticipated
    ours: GET /v1/movies/anticipated
    status: implemented
    rationale: Served at Trakt's path from the same watchlist-weighted anticipation query, shaped as the contract's {list_count, movie} array.
  - trakt: GET /movies/hot
    ours: GET /v1/movies/hot
    status: implemented
    rationale: Ranked by 24h activity (history + checkins + start/scrobble + watchlist adds); list_count is distinct watchlist adders in that window.
  - trakt: GET /movies/streaming/{period}
    ours: GET /v1/movies/streaming/{period}
    status: implemented
    rationale: Movies with a movie_releases.digital date in the period (daily=today, weekly=7 days, monthly=30), ranked by distinct user_history watchers in that same period; delta is null because no previous rank is stored.
  - trakt: GET /movies/boxoffice
    ours: ''
    status: out-of-scope
    rationale: 'decision: Trakt''s /movies/boxoffice is a weekend box-office chart; TMDB dropped box-office figures and carries only a lifetime `revenue` number, which is a different measurement. No honest source, so it is declined rather than filled with a number that is not the one the contract names.'
  - trakt: GET /movies/updates/id/{start_date}
    ours: GET /v1/movies/updates/id/{start_date}
    status: implemented
    rationale: 'Trakt-ID-keyed update feed, landed with the rest of issue #4''s read work; same path and params.'
  - trakt: GET /movies/{id}/related
    ours: GET /v1/movies/{id}/related
    status: blocked-engine
    rationale: Needs the recommendation graph. Our own route GET /v1/movies/recommendations/{id} is the nearest surface but answers 501 not_implemented (its custom-surface row is in the last section), and Trakt's /movies/{id}/related is a distinct surface, so neither is parity here.
    engine: 'recommendations engine (issue #49)'
  - trakt: GET /movies/{id}/releases/{country}
    status: implemented
    ours: GET /v1/movies/{id}/releases/{country}
    rationale: 'Serves real rows from TMDB release_dates stored in media_metadata (kind=releases): per-country theatrical/digital/physical/TV dates with that country''s certification, filtered by the {country} segment. Fetched on the first request, served from the store after.'
  - trakt: GET /movies/{id}/videos
    status: implemented
    ours: GET /v1/movies/{id}/videos
    rationale: 'Serves the movie''s TMDB videos from media_metadata (kind=videos): YouTube trailers/teasers with title, url, site, type, size, official, published_at, country and language. Fetched once, then served from the store.'
  - trakt: GET /movies/{id}/comments/{sort}
    ours: GET /v1/movies/{id}/comments/{sort}
    status: implemented
    rationale: 'Landed with the media comment reads: real rows from comments(media_type=''movie'', media_id) with the same sort vocabulary as Trakt (newest|oldest|likes|replies|trending).'
  - trakt: GET /movies/{id}/sentiments
    ours: ''
    status: out-of-scope
    rationale: 'decision: Trakt derives sentiments from a per-episode sentiment model over its whole comment corpus; nothing in a self-hosted instance produces that signal, and inventing a score is exactly the fabricated payload this manifest forbids. Declined, tracked here so it can be revisited if a scorer is ever built.'
  - trakt: GET /movies/{id}/studios
    status: divergent
    ours: GET /v1/movies/{id}/studios
    rationale: Serves the movie's TMDB production companies as the studio list; we hold no Trakt company ids, so ids.trakt is null and ids.tmdb carries the TMDB company id.
    compat: ids.trakt is null (we hold no Trakt company ids); ids.tmdb is the TMDB production-company id.
  - trakt: GET /movies/{id}/watchnow/{country}
    ours: GET /v1/movies/{id}/watchnow/{country}
    status: implemented
    rationale: 'Served at Trakt''s path: the cached TMDB provider sets, shaped to the contract''s cable/free/cinema/subscription/purchase object (flatrate -> subscription, buy/rent -> purchase).'
  - trakt: GET /movies/{id}/lists/{type}/{sort}
    ours: GET /v1/movies/{id}/lists/{type}/{sort}
    status: implemented
    rationale: Public lists containing the movie ranked by the requested sort; official/watchlist/favorites are not modelled as lists, so they return a computed [] with 200.
  - trakt: GET /movies/{id}/stats
    ours: GET /v1/movies/{id}/stats
    status: divergent
    rationale: 'Served at Trakt''s path: watchers (distinct user_history users), plays (history rows), collectors (distinct user_collection users), comments, lists and votes (user_ratings rows), favorited (user_favorites) are counted from stored rows. One field does not conform: `recommended` is served as null because we store no ''recommend to a friend'' action, and the contract declares it an integer. A 0 there would be a fabricated count, so the row stays divergent until the action exists.'
    compat: every count is real; only `recommended` is null where the contract wants an integer. A client that requires it should treat null as 'unknown', not 0.
  - trakt: GET /movies/{id}/watching
    ours: GET /v1/movies/{id}/watching
    status: implemented
    rationale: Users whose newest live scrobble session names the movie, filtered through the same privacy rule as /v1/users/{id}/watching.
- name: Shows
  rows:
  - trakt: GET /shows/watched/{period}
    ours: GET /v1/shows/watched/{period}
    status: implemented
    rationale: 'Shows roll their episodes'' history up to the show: distinct watchers and plays in the period, with collection counts.'
  - trakt: GET /shows/played/{period}
    ours: GET /v1/shows/played/{period}
    status: implemented
    rationale: Episode history rows in the period window, rolled up to the show, with watcher and collection counts.
  - trakt: GET /shows/collected/{period}
    ours: GET /v1/shows/collected/{period}
    status: implemented
    rationale: Distinct collectors of the show or its episodes in the period window; collector_count dedupes users.
  - trakt: GET /shows/anticipated
    ours: GET /v1/shows/anticipated
    status: implemented
    rationale: Served at Trakt's path from the same watchlist-weighted anticipation query, shaped as the contract's {list_count, show} array.
  - trakt: GET /shows/hot
    ours: GET /v1/shows/hot
    status: implemented
    rationale: Ranked by 24h activity (episode/show history + checkins + scrobbles + watchlist adds); list_count is distinct watchlist adders.
  - trakt: GET /shows/streaming/{period}
    ours: GET /v1/shows/streaming/{period}
    status: blocked-data
    rationale: Driven by streaming release dates, which are not stored (see /calendars/all/streaming).
  - trakt: GET /shows/updates/id/{start_date}
    ours: GET /v1/shows/updates/id/{start_date}
    status: implemented
    rationale: Trakt-ID-keyed update feed; same path and params.
  - trakt: GET /shows/{id}/related
    ours: GET /v1/shows/{id}/related
    status: blocked-engine
    rationale: Needs the recommendation graph; our own route GET /v1/shows/recommendations/{id} is the nearest surface but answers 501 not_implemented (see the custom-surface row in the last section).
    engine: 'recommendations engine (issue #49)'
  - trakt: GET /shows/{id}/videos
    status: implemented
    ours: GET /v1/shows/{id}/videos
    rationale: Serves the show's TMDB videos from media_metadata (kind=videos), fetched once and served from the store.
  - trakt: GET /shows/{id}/comments/{sort}
    ours: GET /v1/shows/{id}/comments/{sort}
    status: implemented
    rationale: 'Landed with the media comment reads: real rows from comments(media_type=''show'', media_id), same sort vocabulary as Trakt.'
  - trakt: GET /shows/{id}/sentiments
    ours: ''
    status: out-of-scope
    rationale: 'decision: same as /movies/{id}/sentiments — no sentiment scorer exists and none is planned, and a fabricated score is worse than an honest absence.'
  - trakt: GET /shows/{id}/studios
    status: divergent
    ours: GET /v1/shows/{id}/studios
    rationale: Serves the show's TMDB networks as the studio list; we hold no Trakt company ids, so ids.trakt is null and ids.tmdb carries the TMDB network id.
    compat: ids.trakt is null (we hold no Trakt company ids); ids.tmdb is the TMDB network id.
  - trakt: GET /shows/{id}/certifications
    status: implemented
    ours: GET /v1/shows/{id}/certifications
    rationale: Serves the show's stored certification as the bare JSON string the vendored contract types this response as (its description says grouped-by-country but its schema is `string`).
  - trakt: GET /shows/{id}/next_episode
    ours: GET /v1/shows/{id}/next_episode
    status: implemented
    rationale: 'Landed: earliest episode airing today or later, with the same 204-when-none contract.'
  - trakt: GET /shows/{id}/last_episode
    ours: GET /v1/shows/{id}/last_episode
    status: implemented
    rationale: 'Landed: most recently aired episode, 204 when there is none.'
  - trakt: GET /shows/{id}/progress/watched
    ours: GET /v1/shows/{id}/progress/watched
    status: implemented
    rationale: 'Landed: aired vs watched episodes per season computed from the episodes table plus the caller''s user_history rows; Trakt''s reset_at is omitted because nothing stores it.'
  - trakt: GET /shows/{id}/progress/collection
    ours: GET /v1/shows/{id}/progress/collection
    status: implemented
    rationale: 'Landed: same per-season breakdown pinned to the caller''s user_collection rows (aired vs collected episodes).'
  - trakt: DELETE /shows/{id}/progress/watched/reset
    ours: DELETE /v1/shows/{id}/progress/watched/reset
    status: implemented
    rationale: 'Undo: deletes the stored reset point and restores previous progress; 204 when no reset exists.'
  - trakt: POST /shows/{id}/progress/watched/reset
    ours: POST /v1/shows/{id}/progress/watched/reset
    status: implemented
    rationale: 'Landed: deletes the caller''s episode watch-history for that show only and returns the recomputed watched progress (Trakt''s shape).'
  - trakt: GET /shows/{id}/lists/{type}/{sort}
    ours: GET /v1/shows/{id}/lists/{type}/{sort}
    status: implemented
    rationale: Public lists containing the show ranked by the requested sort; official/watchlist/favorites are not modelled as lists, so they return a computed [] with 200.
  - trakt: GET /shows/{id}/watchnow/{country}
    ours: GET /v1/shows/{id}/watchnow/{country}
    status: implemented
    rationale: 'Served at Trakt''s path: the cached TMDB provider sets, shaped to the contract''s category object.'
  - trakt: GET /shows/{id}/stats
    ours: GET /v1/shows/{id}/stats
    status: divergent
    rationale: 'Served at Trakt''s path: watchers/plays aggregate user_history over the show''s episodes (history stores episode rows, not show rows); collectors, comments, lists, votes and favorited count rows for the show itself. One field does not conform: `recommended` is null where the contract declares an integer, because no recommend action is stored and a 0 would be a fabricated count.'
    compat: every count is real; only `recommended` is null where the contract wants an integer.
  - trakt: GET /shows/{id}/watching
    ours: GET /v1/shows/{id}/watching
    status: implemented
    rationale: The same live sessions rolled up from the show, its seasons and episodes; private users excluded.
  - trakt: GET /shows/{id}/seasons/{season}
    ours: GET /v1/seasons/{id}
    status: divergent
    rationale: The same season record is served top-level (flat ids), not nested under the show.
    compat: ours resolves a season by our internal id; the compat listener must resolve show+season_number to that id and nest the payload.
  - trakt: GET /shows/{id}/seasons/{season}/episodes/{episode}
    ours: GET /v1/episodes/{id}
    status: divergent
    rationale: The same episode record is served top-level (flat ids), not nested under show/season.
    compat: 'same as the season row: the listener resolves show+season+episode to our episode id and nests the payload.'
  - trakt: GET /shows/{id}/seasons/{season}/translations
    ours: GET /v1/shows/{id}/seasons/{season}/translations
    status: implemented
    rationale: Served at Trakt's path with the language as an optional ?language= query; TMDB season translations shaped as the contract's array.
  - trakt: GET /shows/{id}/seasons/{season}/ratings
    ours: GET /v1/shows/{id}/seasons/{season}/ratings
    status: implemented
    rationale: 'Served at Trakt''s path: show+season_number resolves to our season row, and the distribution is computed from user_ratings as percentages over the 1..10 buckets.'
  - trakt: GET /shows/{id}/seasons/{season}/stats
    ours: GET /v1/shows/{id}/seasons/{season}/stats
    status: implemented
    rationale: 'Served at Trakt''s path: watchers/plays/comments/lists/votes counted from stored rows; collectors is 0 because user_collection cannot store season rows.'
  - trakt: GET /shows/{id}/seasons/{season}/comments/{sort}
    ours: GET /v1/shows/{id}/seasons/{season}/comments/{sort}
    status: implemented
    compat: sort newest|oldest|likes|replies order the stored comments; highest|lowest|plays are declared but not computed from stored rows and answer 400 naming the accepted set, as does any other value.
    rationale: Real rows from comments(media_type='season', media_id); the {sort} path segment resolves to a real ORDER BY instead of a fixed default.
  - trakt: GET /shows/{id}/seasons/{season}/lists/{type}/{sort}
    ours: GET /v1/shows/{id}/seasons/{season}/lists/{type}/{sort}
    status: implemented
    rationale: 'Served at Trakt''s path: show+season resolves to our season row, then public lists storing that season are ranked; official/watchlist/favorites return a computed [] with 200.'
  - trakt: GET /shows/{id}/seasons/{season}/people
    ours: GET /v1/shows/{id}/seasons/{season}/people
    status: implemented
    rationale: Season credits are fetched once from TMDB's season credits append, written to the credits table as media_type='season', and served in the contract people shape.
  - trakt: GET /shows/{id}/seasons/{season}/videos
    status: implemented
    ours: GET /v1/shows/{id}/seasons/{season}/videos
    rationale: Serves TMDB season videos from media_metadata (kind=videos); fetched once, then served from the store.
  - trakt: GET /shows/{id}/seasons/{season}/episodes/{episode}/comments/{sort}
    ours: GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/comments/{sort}
    status: implemented
    rationale: Resolves show+season+episode to our episode row, then reads comments(media_type='episode', media_id) with the {sort} segment applied.
    compat: sort newest|oldest|likes|replies order the stored comments; highest|lowest|plays answer 400 naming the accepted set, as does any other value.
  - trakt: GET /shows/{id}/seasons/{season}/episodes/{episode}/lists/{type}/{sort}
    ours: GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/lists/{type}/{sort}
    status: implemented
    rationale: 'Served at Trakt''s path: show+season+episode resolves to our episode row, then lists containing it are filtered by kind and sort and returned in the contract''s list shape.'
  - trakt: GET /shows/{id}/seasons/{season}/episodes/{episode}/people
    ours: GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/people
    status: implemented
    rationale: Episode guest stars and crew are fetched once from TMDB's episode credits append, written as media_type='episode', and served in the contract people shape.
  - trakt: GET /shows/{id}/seasons/{season}/episodes/{episode}/videos
    status: implemented
    ours: GET /v1/shows/{id}/seasons/{season}/episodes/{episode}/videos
    rationale: Serves TMDB episode videos from media_metadata (kind=videos); fetched once, then served from the store.
- name: People
  rows:
  - trakt: GET /people/{id}/lists/{type}/{sort}
    ours: GET /v1/people/{id}/lists/{type}/{sort}
    status: implemented
    rationale: Public lists containing the person (list_items.media_type is unconstrained, so person rows are queryable); official/watchlist/favorites return a computed [] with 200.
- name: Recommendations
  rows:
  - trakt: DELETE /recommendations/movies/{id}
    ours: DELETE /v1/recommendations/movies/{id}
    status: blocked-engine
    rationale: Hiding a recommendation is a decision the recommendations engine does not model yet (the user_hidden table is not wired to it).
    engine: 'recommendations engine (issue #49)'
  - trakt: DELETE /recommendations/shows/{id}
    ours: DELETE /v1/recommendations/shows/{id}
    status: blocked-engine
    rationale: 'Same as the movie dismissal: no per-item hide decision is modelled.'
    engine: 'recommendations engine (issue #49)'
- name: Sync
  rows:
  - trakt: GET /sync/last_activities
    ours: GET /v1/sync/last_activities
    status: implemented
    rationale: 'Landed with issue #6: MAX() stamps per collection, same path and contract.'
  - trakt: GET /sync/collection/movies
    ours: GET /v1/sync/collection/movies
    status: implemented
    rationale: 'Landed as a per-type read: the collection handler with media_type pinned to ''movie'' by the path segment, Trakt''s exact path.'
  - trakt: GET /sync/collection/shows
    ours: GET /v1/sync/collection/shows
    status: implemented
    rationale: Landed as a per-type read pinned to media_type='show'.
  - trakt: GET /sync/collection/episodes
    ours: GET /v1/sync/collection/{type}
    status: implemented
    rationale: Episode rows in user_collection are the source of truth; seasons and shows with seasons expand to their episode rows, and the generic contract collection route returns Trakt's collected-episode shape for type=episodes.
  - trakt: GET /sync/watchlist/{type}/{sort_by}/{sort_how}
    ours: GET /v1/sync/watchlist/{type}/{sort_by}/{sort_how}
    status: divergent
    rationale: The contract path is registered for movies and shows; user_watchlist cannot store season or episode rows (#71), so the type set this endpoint declares is served only for movies and shows.
    compat: movies and shows served with sort_by rank|added|listed|title|popularity|released|runtime|votes|percentage|random (unknown values 400); seasons and episodes answer 400 because the store cannot hold them (#71).
  - trakt: GET /sync/ratings/{type}/{rating}
    ours: GET /v1/sync/ratings/{type}/{rating}
    status: implemented
    rationale: 'Served at Trakt''s path: all four media types, filtered by the 1..10 rating segment from user_ratings.'
  - trakt: GET /sync/favorites/{type}/{sort_by}/{sort_how}
    ours: GET /v1/sync/favorites/{type}/{sort_by}/{sort_how}
    status: implemented
    rationale: movies and shows are the contract's favorites types; every sort_by orders real columns of the favorite row or its media.
    compat: sort_by rank|added|listed|title|popularity|released|runtime|votes|percentage|random served; any other sort_by answers 400 naming the accepted set.
  - trakt: GET /sync/history/{type}/{id}
    ours: GET /v1/sync/history/{media_type}/{media_id}
    status: implemented
    rationale: 'Served at the contract path shape: the single-item read returns the caller''s rows with the contract''s id, watched_at, action and type fields.'
  - trakt: GET /sync/collection/{type}
    ours: GET /v1/sync/collection/{type}
    status: divergent
    rationale: The generic path is served for episodes as the contract's bare array; movies and shows are shadowed by the existing static per-type routes, which return our paginated envelope.
    compat: 'episodes: bare contract array; movies|shows: the static /v1/sync/collection/{movies,shows} routes win and return the paginated envelope, so those two values are not yet contract-shaped.'
  - trakt: GET /sync/watchlist/movies
    ours: GET /v1/sync/watchlist/movies
    status: implemented
    rationale: Landed as a per-type read pinned to media_type='movie'.
  - trakt: GET /sync/watchlist/shows
    ours: GET /v1/sync/watchlist/shows
    status: implemented
    rationale: Landed as a per-type read pinned to media_type='show'.
  - trakt: GET /sync/watchlist/seasons
    ours: GET /v1/sync/watchlist/seasons
    status: blocked-data
    rationale: user_watchlist.media_type is 'movie' or 'show' only.
  - trakt: GET /sync/watchlist/episodes
    ours: GET /v1/sync/watchlist/episodes
    status: blocked-data
    rationale: user_watchlist.media_type is 'movie' or 'show' only.
  - trakt: GET /sync/ratings/movies
    ours: GET /v1/sync/ratings/movies
